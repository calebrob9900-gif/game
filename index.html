<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON BREACH</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        color: #38e1ff;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #boot.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">NEON BREACH</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
