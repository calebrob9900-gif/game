<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Game Lab — 5 games, double-click to play</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f1a; font-family: system-ui, 'Segoe UI', sans-serif; color: #fff; }
  canvas { display: block; }

  #menu { position: fixed; inset: 0; z-index: 40; overflow-y: auto; padding: 40px 24px 64px; display: block;
    background: radial-gradient(1200px 600px at 70% -10%, #1d3a6e 0, transparent 60%),
                radial-gradient(900px 500px at 10% 110%, #5b1d6e 0, transparent 55%),
                linear-gradient(160deg, #0b0f1a, #0e1426); }
  #menu h1 { font-size: clamp(30px,6vw,58px); text-align: center; letter-spacing: -1px;
    background: linear-gradient(90deg,#6ee7ff,#a78bfa,#f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #menu .sub { text-align: center; color: #9fb0d0; margin: 10px 0 36px; font-size: clamp(13px,2vw,17px); }
  .grid { display: grid; gap: 20px; max-width: 1080px; margin: 0 auto; grid-template-columns: repeat(auto-fit,minmax(290px,1fr)); }
  .card { cursor: pointer; border-radius: 18px; padding: 24px; text-align: left;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.10); color: #fff; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-5px); border-color: rgba(110,231,255,.6); box-shadow: 0 16px 36px rgba(0,0,0,.45); }
  .card .emoji { font-size: 42px; }
  .card h2 { font-size: 20px; margin: 12px 0 7px; }
  .card p { color: #aebbd6; font-size: 13.5px; line-height: 1.5; }
  .card .tag { display: inline-block; margin-top: 14px; padding: 6px 15px; border-radius: 999px; font-weight: 600; font-size: 13px;
    background: linear-gradient(90deg,#6ee7ff,#a78bfa); color: #0b0f1a; }
  #menu footer { text-align: center; color: #6b7a99; margin-top: 40px; font-size: 13px; }

  .hud { position: fixed; top: 16px; left: 16px; z-index: 10; padding: 12px 16px; border-radius: 12px; pointer-events: none;
    background: rgba(8,12,24,.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.12);
    line-height: 1.5; font-variant-numeric: tabular-nums; font-size: 15px; }
  .hud .big { font-size: 28px; font-weight: 800; }
  .hud .label { color: #93a3c4; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .hud b { color: #6ee7ff; font-weight: 700; }

  #banner { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .3s; font-size: clamp(28px,6vw,58px); font-weight: 900; letter-spacing: -1px;
    text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  #banner small { display: block; font-size: 18px; font-weight: 500; color: #cdd8ef; margin-top: 10px; letter-spacing: 0; }

  #help { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; color: #cdd8ef; text-align: center; background: rgba(8,12,24,.55); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(8px); }
  #help:empty { display: none; }
  #help kbd { display: inline-block; padding: 2px 7px; margin: 0 2px; border-radius: 6px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); font-size: 12px; }

  #back { position: fixed; top: 16px; right: 16px; z-index: 30; display: none; cursor: pointer; padding: 9px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: #fff; background: rgba(8,12,24,.6); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(8px); }
  #back:hover { border-color: #6ee7ff; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px;
    font-size: 18px; color: #cdd8ef; z-index: 50; }
</style>
</head>
<body>
  <div id="menu"></div>
  <div id="root"></div>
  <div class="hud" id="hud"></div>
  <div id="banner"></div>
  <div id="help"></div>
  <button id="back">▣ Menu</button>
  <div id="error"></div>
  <script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const menuEl = $('menu'), rootEl = $('root'), hudEl = $('hud'), bannerEl = $('banner'), helpEl = $('help'), backEl = $('back');

    if (typeof THREE === 'undefined') {
      $('error').style.display = 'flex';
      $('error').innerHTML = "Couldn't load the 3D engine.<br>Check your internet connection and re-open this file.";
      menuEl.style.display = 'none';
      return;
    }

    // ---------- shared input ----------
    const Input = { keys: new Set(), pressed: new Set(), mouse: { left: false } };
    addEventListener('keydown', (e) => {
      if (!Input.keys.has(e.code)) Input.pressed.add(e.code);
      Input.keys.add(e.code);
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => Input.keys.delete(e.code));
    addEventListener('mousedown', (e) => { if (e.button === 0) Input.mouse.left = true; });
    addEventListener('mouseup', (e) => { if (e.button === 0) Input.mouse.left = false; });
    const down = (c) => Input.keys.has(c);
    const once = (c) => Input.pressed.has(c);
    const damp = (a, b, l, dt) => THREE.MathUtils.lerp(a, b, 1 - Math.exp(-l * dt));
    const clamp = THREE.MathUtils.clamp;

    // ---------- engine / lifecycle ----------
    let GEN = 0, ACTIVE = null, activeCleanup = null;
    addEventListener('resize', () => {
      if (!ACTIVE) return;
      ACTIVE.camera.aspect = innerWidth / innerHeight; ACTIVE.camera.updateProjectionMatrix();
      ACTIVE.renderer.setSize(innerWidth, innerHeight);
    });

    const banner = {
      _t: 0,
      show(h, t) { bannerEl.innerHTML = h; bannerEl.style.opacity = '1'; this._t = (t === undefined ? 1.2 : t); },
      hide() { bannerEl.style.opacity = '0'; this._t = 0; },
      tick(dt) { if (this._t > 0 && this._t < 1e8) { this._t -= dt; if (this._t <= 0) this.hide(); } },
    };
    const setHelp = (h) => { helpEl.innerHTML = h; };

    function makeEngine(o) {
      o = o || {};
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
      rootEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(o.background === undefined ? 0x87ceeb : o.background);
      if (o.fog) scene.fog = new THREE.Fog(o.fog.color, o.fog.near, o.fog.far);

      const camera = new THREE.PerspectiveCamera(o.fov || 60, innerWidth / innerHeight, 0.1, o.far || 3000);
      camera.position.set(0, 8, 16);

      scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a4032, o.hemi === undefined ? 1.1 : o.hemi));
      const sun = new THREE.DirectionalLight(o.sun === undefined ? 0xfff3e0 : o.sun, o.sunI === undefined ? 2.4 : o.sunI);
      sun.position.set(120, 200, 80); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
      const s = o.shadow || 160;
      sun.shadow.camera.left = -s; sun.shadow.camera.right = s; sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
      sun.shadow.camera.far = 800; sun.shadow.bias = -0.0004;
      scene.add(sun, sun.target);

      const gen = ++GEN; ACTIVE = { renderer, camera };
      const clock = new THREE.Clock();
      function run(update) {
        (function frame() {
          if (gen !== GEN) return;            // a newer game took over -> stop
          requestAnimationFrame(frame);
          const dt = Math.min(clock.getDelta(), 0.05);
          update(dt, clock.elapsedTime);
          banner.tick(dt);
          Input.pressed.clear();
          renderer.render(scene, camera);
        })();
      }
      return { renderer, scene, camera, sun, run };
    }

    function disposeActive() {
      GEN++;
      if (activeCleanup) { try { activeCleanup(); } catch (e) {} activeCleanup = null; }
      if (ACTIVE && ACTIVE.renderer) {
        const c = ACTIVE.renderer.domElement; if (c.parentNode) c.parentNode.removeChild(c);
        ACTIVE.renderer.dispose();
      }
      ACTIVE = null; hudEl.innerHTML = ''; helpEl.innerHTML = ''; banner.hide();
    }

    // =====================================================================
    // GAME 1 — Driving + Stunt
    // =====================================================================
    function gameDriving() {
      const { scene, camera, run } = makeEngine({ background: 0x8fc4ff, fog: { color: 0x8fc4ff, near: 120, far: 900 }, fov: 65 });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x3c6b3a, roughness: 1 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
      const dgrid = new THREE.GridHelper(4000, 200, 0x2c4f2b, 0x2c4f2b); dgrid.position.y = 0.02; scene.add(dgrid);

      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b }), leafMat = new THREE.MeshStandardMaterial({ color: 0x2f7d3a }), rockMat = new THREE.MeshStandardMaterial({ color: 0x808890, roughness: 1 });
      for (let i = 0; i < 200; i++) {
        const r = 120 + Math.random() * 1400, a = Math.random() * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r;
        if (Math.random() < 0.7) {
          const t = new THREE.Group();
          const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 5, 6), trunkMat); tr.position.y = 2.5; tr.castShadow = true;
          const lv = new THREE.Mesh(new THREE.ConeGeometry(4, 10, 7), leafMat); lv.position.y = 9; lv.castShadow = true;
          t.add(tr, lv); t.position.set(x, 0, z); t.scale.setScalar(0.6 + Math.random()); scene.add(t);
        } else { const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1 + Math.random() * 2), rockMat); rk.position.set(x, 0.6, z); rk.castShadow = true; scene.add(rk); }
      }
      const ramps = [];
      function makeRamp(x, z, yaw, sc) {
        const w = 14 * sc, h = 6 * sc, len = 22 * sc, geo = new THREE.BoxGeometry(w, h, len), p = geo.attributes.position;
        for (let i = 0; i < p.count; i++) p.setY(i, p.getZ(i) > 0 ? p.getY(i) + h / 2 : p.getY(i) - h / 2);
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd64545, roughness: 0.8 }));
        m.position.set(x, h / 2, z); m.rotation.y = yaw; m.castShadow = m.receiveShadow = true; scene.add(m); ramps.push({ x, z, scale: sc });
      }
      makeRamp(0, 90, 0, 1.4); makeRamp(120, -60, Math.PI / 2, 1); makeRamp(-150, 40, -Math.PI / 4, 1.2); makeRamp(60, 240, Math.PI, 1.6); makeRamp(-90, -200, Math.PI / 6, 1);

      const buildCar = () => { const g = new THREE.Group(), bm = new THREE.MeshStandardMaterial({ color: 0x2a7fff, metalness: 0.4, roughness: 0.35 });
        const b = new THREE.Mesh(new THREE.BoxGeometry(4, 1.1, 8), bm); b.position.y = 1.1; b.castShadow = true;
        const c = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0x10243f })); c.position.set(0, 2.1, -0.3); c.castShadow = true;
        const sp = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.3, 1), bm); sp.position.set(0, 2.0, -3.6); g.add(b, c, sp); return g; };
      const buildBike = () => { const g = new THREE.Group(), fm = new THREE.MeshStandardMaterial({ color: 0xff5a2a, metalness: 0.3, roughness: 0.4 });
        const f = new THREE.Mesh(new THREE.BoxGeometry(1, 1.4, 5), fm); f.position.y = 1.6; f.castShadow = true;
        const s2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 2.4), new THREE.MeshStandardMaterial({ color: 0x111111 })); s2.position.set(0, 2.4, -0.5); g.add(f, s2); return g; };
      const wheelGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.7, 16), wheelMat = new THREE.MeshStandardMaterial({ color: 0x111418, roughness: 0.9 });
      const addWheels = (grp) => { const ws = []; [[-1.9, 3], [1.9, 3], [-1.9, -3], [1.9, -3]].forEach(([x, z]) => { const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z = Math.PI / 2; w.position.set(x, 1.1, z); w.castShadow = true; grp.add(w); ws.push(w); }); return ws; };

      const car = new THREE.Group(); let skin = buildCar(); car.add(skin); const wheels = addWheels(car); scene.add(car);
      const v = { pos: new THREE.Vector3(0, 0, -20), yaw: 0, speed: 0, vy: 0, air: false, pitch: 0, bike: false };
      let airtime = 0, score = 0, bestAir = 0; const G = 55;
      setHelp('<kbd>W</kbd>/<kbd>S</kbd> drive · <kbd>A</kbd>/<kbd>D</kbd> steer · <kbd>Space</kbd> handbrake · <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> flip · <kbd>V</kbd> car/bike · <kbd>R</kbd> reset');

      run((dt) => {
        const maxF = v.bike ? 95 : 80, acc = v.bike ? 55 : 45, turn = v.bike ? 1.8 : 1.5;
        if (down('KeyW') || down('ArrowUp')) v.speed += acc * dt; else if (down('KeyS') || down('ArrowDown')) v.speed -= acc * 1.1 * dt; else v.speed *= (1 - 0.6 * dt);
        v.speed = clamp(v.speed, -28, maxF);
        const hb = down('Space');
        if (!v.air) { const st = (down('KeyA') ? 1 : 0) - (down('KeyD') ? 1 : 0); v.yaw += st * turn * (hb ? 1.9 : 1) * dt * clamp(v.speed / 25, -1, 1); if (hb) v.speed *= (1 - 1.2 * dt); }
        const fwd = new THREE.Vector3(Math.sin(v.yaw), 0, Math.cos(v.yaw)); v.pos.addScaledVector(fwd, v.speed * dt);
        if (!v.air && v.speed > 28) for (const r of ramps) { const dx = v.pos.x - r.x, dz = v.pos.z - r.z; if (dx * dx + dz * dz < (16 * r.scale) ** 2) { v.air = true; v.vy = v.speed * 0.55 + 12 * r.scale; airtime = 0; break; } }
        if (v.air) { v.vy -= G * dt; v.pos.y += v.vy * dt; airtime += dt; v.pitch += ((down('ArrowUp') ? 1 : 0) - (down('ArrowDown') ? 1 : 0)) * 4 * dt;
          if (v.pos.y <= 0) { v.pos.y = 0; const fl = Math.floor(Math.abs(v.pitch) / (Math.PI * 2)), got = Math.round(airtime * 50 + fl * 250); score += got; bestAir = Math.max(bestAir, airtime); if (airtime > 0.6) banner.show('+' + got + '<small>' + (fl ? fl + 'x FLIP! ' : '') + airtime.toFixed(1) + 's air</small>', 1.2); v.air = false; v.vy = 0; v.pitch = 0; } }
        if (once('KeyV')) { car.remove(skin); v.bike = !v.bike; skin = v.bike ? buildBike() : buildCar(); car.add(skin); }
        if (once('KeyR')) { v.pos.set(0, 0, -20); v.yaw = 0; v.speed = 0; v.air = false; v.pitch = 0; }
        car.position.copy(v.pos); car.rotation.set(v.pitch, v.yaw, 0);
        const sv = (down('KeyA') ? 0.4 : 0) - (down('KeyD') ? 0.4 : 0); wheels.forEach((w, i) => { w.rotation.x += v.speed * dt * 0.5; if (i < 2) w.rotation.y = sv; });
        const tx = v.pos.x - Math.sin(v.yaw) * 22, ty = v.pos.y + 11, tz = v.pos.z - Math.cos(v.yaw) * 22;
        camera.position.set(damp(camera.position.x, tx, 6, dt), damp(camera.position.y, ty, 6, dt), damp(camera.position.z, tz, 6, dt));
        camera.lookAt(v.pos.x, v.pos.y + 2, v.pos.z);
        hudEl.innerHTML = `<div class="label">${v.bike ? '🏍️ Dirt Bike' : '🏎️ Car'}</div><div class="big">${Math.abs(Math.round(v.speed * 3.6))} <span style="font-size:14px">km/h</span></div><div><span class="label">Score</span> <b>${score}</b></div><div><span class="label">Best air</span> <b>${bestAir.toFixed(1)}s</b></div>` + (v.air ? `<div style="color:#ffd36e">✈ AIRBORNE ${airtime.toFixed(1)}s</div>` : '');
      });
    }

    // =====================================================================
    // GAME 2 — Arcade FPS Shooter
    // =====================================================================
    function gameFPS() {
      const eng = makeEngine({ background: 0x05060f, fog: { color: 0x05060f, near: 40, far: 220 }, fov: 75, sun: 0x9fd0ff, sunI: 0.6, shadow: 120 });
      const { scene, camera, renderer, run } = eng;
      scene.add(new THREE.AmbientLight(0x2a3360, 1.4));
      const ARENA = 100;
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2), new THREE.MeshStandardMaterial({ color: 0x0a0e1f, roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
      const grid = new THREE.GridHelper(ARENA * 2, 50, 0x1de9ff, 0x14315c); grid.position.y = 0.02; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x0c1330, emissive: 0x1b6bff, emissiveIntensity: 0.6 });
      for (const s of [-1, 1]) { const a = new THREE.Mesh(new THREE.BoxGeometry(ARENA * 2, 6, 1), wallMat); a.position.set(0, 3, s * ARENA); scene.add(a); const b = new THREE.Mesh(new THREE.BoxGeometry(1, 6, ARENA * 2), wallMat); b.position.set(s * ARENA, 3, 0); scene.add(b); }
      const cov = [0xff2d75, 0x1de9ff, 0xa855f7, 0x39ff14, 0xffb800];
      for (let i = 0; i < 14; i++) { const r = 18 + Math.random() * (ARENA - 28), an = Math.random() * Math.PI * 2, w = 3 + Math.random() * 6, h = 4 + Math.random() * 10, d = 3 + Math.random() * 6;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x10162e, emissive: cov[(Math.random() * cov.length) | 0], emissiveIntensity: 0.35, roughness: 0.6 }));
        m.position.set(Math.cos(an) * r, h / 2, Math.sin(an) * r); m.castShadow = m.receiveShadow = true; scene.add(m); }

      const EYE = 3, rig = new THREE.Group(); rig.position.set(0, EYE, ARENA * 0.6); rig.add(camera); camera.position.set(0, 0, 0); scene.add(rig);
      let yaw = Math.PI, pitch = 0; const PL = THREE.MathUtils.degToRad(85);
      const gun = new THREE.Group(), gm = new THREE.MeshStandardMaterial({ color: 0x161b2e, emissive: 0x1de9ff, emissiveIntensity: 0.25, roughness: 0.4, metalness: 0.6 });
      const gb = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.7), gm); gb.position.set(0, 0, -0.25);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), gm); bar.rotation.x = Math.PI / 2; bar.position.set(0, 0.02, -0.7);
      gun.add(gb, bar); gun.position.set(0.32, -0.28, -0.6); camera.add(gun);
      const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff2a0, transparent: true, opacity: 0 })); muzzle.position.set(0, 0.02, -0.95); gun.add(muzzle);

      const targets = [], NEON = [0xff2d75, 0x1de9ff, 0x39ff14, 0xa855f7, 0xff7a00];
      const spot = () => new THREE.Vector3((Math.random() * 2 - 1) * (ARENA - 14), 2.4 + Math.random() * 4, (Math.random() * 2 - 1) * (ARENA - 14));
      function makeTarget() { const col = NEON[(Math.random() * NEON.length) | 0], g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2.2, 12), new THREE.MeshStandardMaterial({ color: 0x0c1124, emissive: col, emissiveIntensity: 0.5, roughness: 0.5 })); body.castShadow = true;
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: col })); core.position.y = 0.4;
        g.add(body, core); const p = spot(); g.position.copy(p); g.userData = { base: p.clone(), phase: Math.random() * 6.28, dir: Math.random() * 6.28, pop: 0 }; scene.add(g); targets.push(g); }
      for (let i = 0; i < 7; i++) makeTarget();
      function respawn(t) { const p = spot(); t.userData.base.copy(p); t.userData.dir = Math.random() * 6.28; t.position.copy(p); t.scale.setScalar(1); }

      const tracerMat = new THREE.LineBasicMaterial({ color: 0x9fffff, transparent: true, opacity: 0 });
      const tracer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), tracerMat); tracer.frustumCulled = false; scene.add(tracer);
      let tracerLife = 0, muzzleLife = 0;

      const cross = document.createElement('div');
      cross.style.cssText = 'position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:15;pointer-events:none';
      cross.innerHTML = '<div style="position:absolute;left:8px;top:0;width:2px;height:18px;background:rgba(255,255,255,.85)"></div><div style="position:absolute;top:8px;left:0;height:2px;width:18px;background:rgba(255,255,255,.85)"></div>';
      document.body.appendChild(cross);
      setHelp('<kbd>Click</kbd> lock mouse · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Mouse</kbd> aim · <kbd>Shift</kbd> sprint · <kbd>Click</kbd> shoot · <kbd>Esc</kbd> release');

      const canvas = renderer.domElement;
      let locked = false;
      const onClickLock = () => { if (!over) canvas.requestPointerLock(); };
      const onLockChange = () => { locked = document.pointerLockElement === canvas; };
      const onMove = (e) => { if (!locked || over) return; yaw -= e.movementX * 0.0022; pitch = clamp(pitch - e.movementY * 0.0022, -PL, PL); };
      canvas.addEventListener('click', onClickLock); document.addEventListener('pointerlockchange', onLockChange); document.addEventListener('mousemove', onMove);

      const ray = new THREE.Raycaster();
      let score = 0, hits = 0, combo = 1, comboT = 0, timeLeft = 60, over = false, firing = false;
      function shoot() {
        ray.setFromCamera(new THREE.Vector2(0, 0), camera); const origin = new THREE.Vector3(); camera.getWorldPosition(origin); muzzleLife = 0.06;
        const hit = ray.intersectObjects(targets, true).find((h) => h.object.parent && targets.includes(h.object.parent) && h.object.parent.userData.pop <= 0);

      const gates = [], GATES = 8;
      const mkBuoy = (x, z, c) => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.4, 3, 12), new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 })); b.position.y = 1; const ball = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.4 })); ball.position.y = 2.6; g.add(b, ball); g.position.set(x, 0, z); scene.add(g); };
      for (let i = 0; i < GATES; i++) { const z = 60 + i * 70, cx = Math.sin(i * 0.9) * 50, half = 9; mkBuoy(cx - half, z, 0xd62828); mkBuoy(cx + half, z, 0x2ecc71); gates.push({ x: cx, z, half, passed: false }); }

      const SMAX = 60, sgeo = new THREE.SphereGeometry(0.35, 6, 6), smat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }), spray = [];
      for (let i = 0; i < SMAX; i++) { const p = new THREE.Mesh(sgeo, smat.clone()); p.visible = false; scene.add(p); spray.push({ mesh: p, life: 0, vel: new THREE.Vector3() }); }
      let sc = 0; const emit = (x, y, z, b) => { const s = spray[sc]; sc = (sc + 1) % SMAX; s.mesh.position.set(x + (Math.random() - 0.5) * 1.5, y + 0.3, z + (Math.random() - 0.5) * 1.5); s.vel.set(b.x * 4 + (Math.random() - 0.5) * 4, 3 + Math.random() * 3, b.z * 4 + (Math.random() - 0.5) * 4); s.life = 0.6; s.mesh.visible = true; };

      const v = { pos: new THREE.Vector3(0, 0, 0), yaw: 0, speed: 0, vy: 0, air: false, pitch: 0, bob: 0 }; const G = 32;
      let airtime = 0, score = 0, bestAir = 0, gp2 = 0, combo = 0;
      setHelp('<kbd>W</kbd>/<kbd>S</kbd> throttle · <kbd>A</kbd>/<kbd>D</kbd> steer · <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> flip · <kbd>R</kbd> reset');

      run((dt, t) => {
        for (let i = 0; i < oP.count; i++) oP.setY(i, W(bx[i], bz[i], t)); oP.needsUpdate = true; og.computeVertexNormals();
        ocean.position.x = camera.position.x; ocean.position.z = camera.position.z;
        if (down('KeyW')) v.speed += 42 * dt; else if (down('KeyS')) v.speed -= 46 * dt; else v.speed *= (1 - 0.5 * dt); v.speed = clamp(v.speed, -18, 70);
        if (!v.air) { const st = (down('KeyA') ? 1 : 0) - (down('KeyD') ? 1 : 0); v.yaw += st * 1.6 * dt * clamp(v.speed / 20, -1, 1); }
        const fwd = new THREE.Vector3(Math.sin(v.yaw), 0, Math.cos(v.yaw)); v.pos.addScaledVector(fwd, v.speed * dt);
        const wh = W(v.pos.x, v.pos.z, t), e = 2.2, dF = W(v.pos.x + fwd.x * e, v.pos.z + fwd.z * e, t), dB = W(v.pos.x - fwd.x * e, v.pos.z - fwd.z * e, t);
        const rv = new THREE.Vector3(Math.cos(v.yaw), 0, -Math.sin(v.yaw)), dR = W(v.pos.x + rv.x * e, v.pos.z + rv.z * e, t), dL = W(v.pos.x - rv.x * e, v.pos.z - rv.z * e, t);
        const slF = (dF - dB) / (2 * e), slS = (dR - dL) / (2 * e);
        if (!v.air && v.speed > 30 && slF > 0.18) { v.air = true; v.vy = slF * v.speed * 0.9 + 4; airtime = 0; v.pos.y = wh; }
        if (v.air) { v.vy -= G * dt; v.pos.y += v.vy * dt; airtime += dt; v.pitch += ((down('ArrowUp') ? 1 : 0) - (down('ArrowDown') ? 1 : 0)) * 3.5 * dt;
          if (v.pos.y <= wh) { v.pos.y = wh; const fl = Math.floor(Math.abs(v.pitch) / (Math.PI * 2)), got = Math.round(airtime * 60 + fl * 300); score += got; bestAir = Math.max(bestAir, airtime); if (airtime > 0.5) banner.show('+' + got + '<small>' + (fl ? fl + 'x FLIP! ' : '') + airtime.toFixed(1) + 's big air</small>', 1.2); for (let k = 0; k < 6; k++) emit(v.pos.x, v.pos.y, v.pos.z, fwd.clone().negate()); v.air = false; v.vy = 0; v.pitch = 0; } }
        else { v.bob += dt * (2 + Math.abs(v.speed) * 0.05); v.pos.y = wh + Math.sin(v.bob) * 0.15; }
        for (const g of gates) { if (g.passed) continue; if (Math.abs(v.pos.z - g.z) < 4 && Math.abs(v.pos.x - g.x) < g.half) { g.passed = true; gp2++; combo++; score += 100 * combo; banner.show('GATE ' + gp2 + '/' + GATES + '<small>combo x' + combo + ' · +' + (100 * combo) + '</small>', 1); } else if (v.pos.z - g.z > 6 && combo > 0) combo = 0; }
        if (!v.air && Math.abs(v.speed) > 12 && Math.random() < 0.8) emit(v.pos.x - fwd.x * 3, v.pos.y, v.pos.z - fwd.z * 3, fwd.clone().negate());
        for (const p of spray) { if (p.life <= 0) continue; p.life -= dt; p.vel.y -= G * 0.6 * dt; p.mesh.position.addScaledVector(p.vel, dt); p.mesh.material.opacity = Math.max(0, p.life / 0.6) * 0.9; if (p.life <= 0) p.mesh.visible = false; }
        if (once('KeyR')) { v.pos.set(0, 0, 0); v.yaw = 0; v.speed = 0; v.vy = 0; v.air = false; v.pitch = 0; airtime = 0; score = 0; bestAir = 0; gp2 = 0; combo = 0; for (const g of gates) g.passed = false; }
        ski.position.copy(v.pos); ski.rotation.set(v.air ? v.pitch : -Math.atan(slF) * 1.2, v.yaw, v.air ? 0 : Math.atan(slS) * 1.2, 'YXZ');
        const cx = v.pos.x - Math.sin(v.yaw) * 18, cz = v.pos.z - Math.cos(v.yaw) * 18; let cy = v.pos.y + 9; cy = Math.max(cy, W(cx, cz, t) + 3);
        camera.position.set(damp(camera.position.x, cx, 5, dt), damp(camera.position.y, cy, 5, dt), damp(camera.position.z, cz, 5, dt));
        camera.lookAt(v.pos.x + fwd.x * 6, v.pos.y + 2, v.pos.z + fwd.z * 6);
        hudEl.innerHTML = `<div class="label">🌊 Jet-Ski</div><div class="big">${Math.abs(Math.round(v.speed * 3.6))} <span style="font-size:14px">km/h</span></div><div><span class="label">Gates</span> <b>${gp2}/${GATES}</b>${combo > 1 ? ` <span style="color:#ffd36e">x${combo}</span>` : ''}</div><div><span class="label">Score</span> <b>${score}</b></div><div><span class="label">Best air</span> <b>${bestAir.toFixed(1)}s</b></div>` + (v.air ? `<div style="color:#ffd36e">✈ AIRBORNE ${airtime.toFixed(1)}s</div>` : '');
      });
    }

    // ---------- menu / router ----------
    const GAMES = [
      { emoji: '🏎️', name: 'Driving + Stunt', desc: 'Drift a car, hit ramps, flip for airtime. Press V to swap to a dirt bike.', fn: gameDriving },
      { emoji: '🔫', name: 'Arcade FPS Shooter', desc: 'Mouse-look neon arena. Click to lock the mouse, then shoot the bots. 60s, build combos.', fn: gameFPS },
      { emoji: '🏍️', name: 'Motocross / Dirt Bike', desc: 'Ride a dirt bike over rolling hills, crest the jumps, flip and stick the landing.', fn: gameMotocross },
      { emoji: '✈️', name: 'Sky Racer', desc: 'Bank a jet through 12 glowing rings with real banking turns. Beat the course.', fn: gameSky },
      { emoji: '🌊', name: 'Jet-Ski Wave Rider', desc: 'Carve a living ocean, launch off wave crests, slalom the buoy gates.', fn: gameJetski },
    ];
    function buildMenu() {
      menuEl.innerHTML = '<h1>🎮 Game Lab</h1><p class="sub">Five playable prototypes — pick one. Keyboard + mouse. Hit ▣ Menu (top-right) to come back.</p><div class="grid" id="grid"></div><footer>One file · no install · works in any modern browser</footer>';
      const grid = $('grid');
      GAMES.forEach((g, i) => {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="emoji">${g.emoji}</div><h2>${g.name}</h2><p>${g.desc}</p><span class="tag">Play ▸</span>`;
        card.addEventListener('click', () => launch(i));
        grid.appendChild(card);
      });
    }
    function launch(i) { disposeActive(); menuEl.style.display = 'none'; backEl.style.display = 'block'; GAMES[i].fn(); }
    function toMenu() { disposeActive(); menuEl.style.display = 'block'; backEl.style.display = 'none'; }
    backEl.addEventListener('click', toMenu);
    buildMenu();
  })();
  </script>
</body>
</html>
